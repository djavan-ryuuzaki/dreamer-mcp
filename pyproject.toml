[project]
name = "dreamer-mcp"
version = "0.4.0"
description = "MCP server for a remote ComfyUI instance (HTTP API), designed to run in Docker/Kubernetes"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.12",
    "httpx>=0.27",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "pillow>=10.0",
    "uvicorn>=0.30",
]

[project.urls]
Repository = "https://github.com/djavan-ryuuzaki/dreamer-mcp"
Issues = "https://github.com/djavan-ryuuzaki/dreamer-mcp/issues"

[project.scripts]
dreamer-mcp = "dreamer_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dreamer_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"workflows" = "dreamer_mcp/default_workflows"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
