# What the default presets (workflows/workflows.yaml) need on the ComfyUI server.
# Shown at startup, by `dreamer-mcp requirements` and by the comfyui_requirements tool.
#
# nodes:     node classes, grouped by the package that provides them ("ComfyUI" = core,
#            i.e. update ComfyUI when one is missing). optional: true = not needed to run.
# models:    file name + models/<folder>; files in subfolders of <folder> also count.
# workflows: API-format workflows the presets load from ComfyUI (user/default/workflows/...);
#            when missing there, the copy shipped in workflows/ (same file name) is used.

comfyui:
  url: https://github.com/comfyanonymous/ComfyUI
  tested_version: "0.37.0"

groups:
  image:
    title: Images and assets (comfyui_generate_image, comfyui_generate_asset) - Qwen Image 2.1
    workflows: [api/generate_image.json, api/generate_asset.json]
    nodes:
      - package: ComfyUI
        classes: [TextEncodeQwenImage21, ModelAttentionBackend, PrimitiveStringMultiline]
      - package: ComfyUI-Easy-Use
        url: https://github.com/yolain/ComfyUI-Easy-Use
        classes: [easy ifElse, easy cleanGpuUsed, easy clearCacheAll]
      - package: ComfyUI-KJNodes
        url: https://github.com/kijai/ComfyUI-KJNodes
        classes: [INTConstant]  # SetNode/GetNode are frontend-only, not in /object_info
        optional: true
        note: Set/Get nodes, only to open/edit the UI versions (GENERATE_IMAGE / GENERATE_ASSET)
    models:
      - file: qwen_image_2.1_int8_convrot.safetensors
        folder: diffusion_models
        size_gb: 7.3
        url: https://huggingface.co/Comfy-Org/Qwen-Image-2.1/resolve/main/diffusion_models/qwen_image_2.1_int8_convrot.safetensors
      - file: qwen3vl_8b_int8_convrot.safetensors
        folder: text_encoders
        size_gb: 9.4
        url: https://huggingface.co/Comfy-Org/Qwen-Image-2.1/resolve/main/text_encoders/qwen3vl_8b_int8_convrot.safetensors
      - file: qwen_image_2.1_vae_bf16.safetensors
        folder: vae
        size_gb: 0.7
        url: https://huggingface.co/Comfy-Org/Qwen-Image-2.1/resolve/main/vae/qwen_image_2.1_vae_bf16.safetensors

  video:
    title: Video with sound (comfyui_generate_video) - MiniMax H3 reference-to-video
    workflows: [api/minimax_h3_r2v.json]
    nodes:
      - package: ComfyUI
        classes: [MiniMaxH3ReferenceToVideo, ComfyMathExpression, ComfySwitchNode, ResolutionSelector]
    models:
      - file: minimax_h3_ref2va_pruned_int8_convrot.safetensors
        folder: diffusion_models
        size_gb: 21.0
        url: https://huggingface.co/Comfy-Org/MiniMax-H3/resolve/main/diffusion_models/minimax_h3_ref2va_pruned_int8_convrot.safetensors
      - file: qwen3vl_32b_minimax_h3_int8_convrot.safetensors
        folder: text_encoders
        size_gb: 27.1
        url: https://huggingface.co/Comfy-Org/MiniMax-H3/resolve/main/text_encoders/qwen3vl_32b_minimax_h3_int8_convrot.safetensors
      - file: minimax_h3_video_vae_int8_convrot.safetensors
        folder: vae
        size_gb: 2.8
        url: https://huggingface.co/Comfy-Org/MiniMax-H3/resolve/main/vae/minimax_h3_video_vae_int8_convrot.safetensors
      - file: minimax_h3_audio_vae_fp32.safetensors
        folder: vae
        size_gb: 0.6
        url: https://huggingface.co/Comfy-Org/MiniMax-H3/resolve/main/vae/minimax_h3_audio_vae_fp32.safetensors
      - file: minimax_h3_taomate_3step_lora_avg_rank_19_bf16.safetensors
        folder: loras
        size_gb: 0.2
        url: https://huggingface.co/Kijai/MiniMax-H3_comfy/resolve/main/loras/minimax_h3_taomate_3step_lora_avg_rank_19_bf16.safetensors
        note: TaoMate 3-step LoRA (the workflow samples in 3 steps)

  audio:
    title: Music with vocals (comfyui_generate_music, comfyui_song_to_abc) - YuE2 + SheetSage2
    workflows: [api/generate_music.json, api/generate_cover_music.json, api/generate_song_abc.json]
    nodes:
      - package: ComfyUI
        classes: [YuE2GenerateABC, YuE2GenerateMusic, EmptyYuE2LatentAudio, SheetSage2AudioToABC,
                  AudioEncoderLoader, LoadAudio, SaveAudio, SaveText, PreviewAny]
      - package: ComfyUI-Easy-Use
        url: https://github.com/yolain/ComfyUI-Easy-Use
        classes: [easy ifElse, easy cleanGpuUsed, easy clearCacheAll]
    models:
      - file: yue2_3b_int8_convrot.safetensors
        folder: checkpoints
        size_gb: 4.0
        url: https://huggingface.co/Comfy-Org/YuE2/resolve/main/checkpoints/yue2_3b_int8_convrot.safetensors
      - file: sheetsage2_bf16.safetensors
        folder: audio_encoders
        size_gb: 1.4
        url: https://huggingface.co/Comfy-Org/YuE2/resolve/main/audio_encoders/sheetsage2_bf16.safetensors
        note: Covers and comfyui_song_to_abc (audio -> ABC transcription)
