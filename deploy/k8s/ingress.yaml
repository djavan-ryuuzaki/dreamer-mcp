# Optional: expose the MCP outside the cluster (for Claude Desktop/Code on your machine).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dreamer-mcp
spec:
  ingressClassName: traefik
  rules:
    - host: dreamer-mcp.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: dreamer-mcp, port: {name: http}}
  # tls:
  #   - hosts: [dreamer-mcp.example.com]
  #     secretName: dreamer-mcp-tls
